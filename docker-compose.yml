# Lokale Entwicklungsumgebung: PostgreSQL
# Start: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moeller
      POSTGRES_PASSWORD: moeller_dev
      POSTGRES_DB: moeller
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moeller -d moeller"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
